name: Integrate final terrain navigation test correction
on:
  push:
    branches: ['codex/glpi-ticket-500ms-kitt-20261116']
    paths: ['.github/workflows/integrate-source-provenance.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'M4D135/GLPI-Pilot' && github.ref == 'refs/heads/codex/glpi-ticket-500ms-kitt-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Target the actual parent details used by the production map
        shell: python
        run: |
          import hashlib,pathlib,subprocess
          name='tests/WebViewChecks/Program.LocalFileTest.cs'
          raw=subprocess.check_output(['git','show','HEAD:'+name])
          def blob(value):return hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
          assert blob(raw)=='2da21f21bb28da132821e6a65e10a413c1bb3d54','Source changed'
          text=raw.decode('utf-8')
          assert text.count('.map-management-tools')==4
          text=text.replace('.map-management-tools','.maps-workspace-actions')
          raw=text.encode('utf-8')
          assert blob(raw)=='c0727210c3d66e94b4edb2db6aaadbddd1926c24'
          assert "class:'maps-workspace-actions'" in pathlib.Path('web/js/pages/terrain-map.js').read_text()
          pathlib.Path(name).write_bytes(raw)
          subprocess.run(['git','add','--',name],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only'],text=True).strip()==name
      - name: Verify release safeguards
        run: python3 -m unittest discover -s tests/ReleasePackChecks -p 'test_*.py'
      - name: Commit only the corrected test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/glpi-ticket-500ms-kitt-20261116
          gh auth setup-git
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Open the actual terrain management container before testing its nested tools'
          git push origin "HEAD:refs/heads/$branch"
