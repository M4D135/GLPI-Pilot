name: Finalize production documentation
on:
  push:
    branches: ['codex/glpi-ticket-500ms-kitt-20261116']
    paths: ['.github/workflows/finalize-production-readme.yml']
permissions:
  contents: write
jobs:
  documentation:
    if: github.repository == 'M4D135/GLPI-Pilot' && github.ref == 'refs/heads/codex/glpi-ticket-500ms-kitt-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Update the release section while keeping historical documentation
        shell: python
        run: |
          import hashlib,pathlib,subprocess
          raw=subprocess.check_output(['git','show','HEAD:README.md'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='49b89110c10f92920536d7577f8aa2ed9d32e733'
          lines=raw.decode('utf-8').splitlines(keepends=True)
          count=0
          for i,line in enumerate(lines):
            if line.startswith('Les packs publiés sont disponibles'):
              lines[i]='Les packs publiés sont disponibles dans les [Releases](https://github.com/M4D135/GLPI-Pilot/releases). La publication du pack 4.0.0 exige une qualification Windows et PostgreSQL complète sur le commit exact ainsi que la vérification de l’archive originale. La page Releases fait foi pour la disponibilité ; une compilation ou un artefact de test ne constitue pas une publication. Les tests utilisent des données fictives : le portail GLPI, le SSO et les accès réseau propres à l’organisation restent à vérifier sur un poste autorisé avant diffusion généralisée.\n'
              count+=1
            elif line.startswith('## 4.0.0 : HyperMotion'):
              lines[i]='## 4.0.0 : interface, cartes et parcours tickets\n';count+=1
            elif line.startswith('Refonte visuelle Domenia v2/HyperMotion,'):
              lines[i]='Interface inspirée de Domenia v2, textes neutres sans slogans, thèmes clair/sombre et nuages des Réglages corrigés. La carte ouvre les rues détaillées par défaut et transmet les lieux choisis à une seule recherche centrale. Les descriptions, la sélection et le contexte sont conservés entre carte, recherche, fiche, planning et matériel. Navigation précédent/suivant dans les résultats, y compris entre les pages. Lecture GLPI après 500 ms, annulation des lectures inutiles, cache récent et indicateur K2000 discret. Les imports de configuration 3.15.1/4.0 sont pris en charge ; la simulation sur fichier reste distinguée des données de démonstration. Voir les [notes de version et limites de validation](docs/RELEASE-4.0.0.md).\n'
              count+=1
            elif line.startswith('La version courante réunit recherche, carte, planning,'):
              lines[i]=line.replace('La version courante','La version historique 3.15.0',1);count+=1
          assert count==4,'Unexpected documentation structure'
          pathlib.Path('README.md').write_bytes(''.join(lines).encode('utf-8'))
          subprocess.run(['git','add','README.md'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only'],text=True).strip()=='README.md'
      - name: Commit documentation on the feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/glpi-ticket-500ms-kitt-20261116
          gh auth setup-git
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document 4.0 release scope and retain explicit production qualification safeguards'
          git push origin "HEAD:refs/heads/$branch"
