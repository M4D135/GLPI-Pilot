name: Ergonomie et commandes tickets - qualification sans publication
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/ergonomie-terrain-20261027]
    paths: ['web/**', 'tests/**', 'src/**', 'build-tools/**', '.github/workflows/**', 'docs/**', 'package.json']
permissions:
  contents: read
jobs:
  ergonomics:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Choisir le navigateur et consigner le commit
        run: |
          New-Item -ItemType Directory -Path artifacts/ergonomics -Force | Out-Null
          $browser = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe', 'C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No Chromium browser on the runner.' }
          "GLPI_TEST_CHROMIUM=$browser" >> $env:GITHUB_ENV
          "Commit: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID / $env:GITHUB_RUN_ATTEMPT" | Set-Content artifacts/ergonomics/context.log
      - name: Vrais handlers C# de ticket et stockage existant
        run: |
          dotnet run --project tests/WorkplaceBridgeChecks/WorkplaceBridgeChecks.csproj -c Release -p:PlaywrightPlatform=win 2>&1 | Tee-Object artifacts/ergonomics/workplace.log
          if ($LASTEXITCODE -ne 0) { throw 'Workplace bridge checks failed.' }
      - name: Ergonomie avec la CSP et les modules de production
        run: |
          $driver = Join-Path $PWD 'tests/WorkplaceBridgeChecks/bin/Release/net10.0/.playwright'
          $node = Join-Path $driver 'node/win32_x64/node.exe'
          $env:GLPI_TEST_PLAYWRIGHT_MODULE = Join-Path $driver 'package'
          $env:GLPI_TEST_SCREENSHOTS = Join-Path $PWD 'artifacts/ergonomics/screenshots'
          Remove-Item Env:GLPI_TEST_OFFLINE_BLOBS -ErrorAction SilentlyContinue
          & $node --test tests/WorkspaceGridChecks/run.mjs tests/PilotBoardLabelsChecks/run.mjs tests/WeatherGroupPickerChecks/run.mjs 2>&1 | Tee-Object artifacts/ergonomics/grid.log
          if ($LASTEXITCODE -ne 0) { throw 'Grid regression checks failed.' }
          & $node tests/ErgonomicsChecks/run.cjs 2>&1 | Tee-Object artifacts/ergonomics/ui.log
          if ($LASTEXITCODE -ne 0) { throw 'Ergonomics checks failed.' }
      - name: Préparation réelle via pont C# et SQLite Standard/Admin
        run: |
          foreach ($edition in @('false', 'true')) {
            dotnet run --project tests/FieldIntegratedUiChecks/FieldIntegratedUiChecks.csproj -c Release -p:PlaywrightPlatform=win "-p:PilotAdmin=$edition" 2>&1 | Tee-Object "artifacts/ergonomics/field-$edition.log"
            if ($LASTEXITCODE -ne 0) { throw "Field bridge checks failed ($edition)." }
          }
      - name: Météo, grille et navigation existantes Standard/Admin
        run: |
          foreach ($edition in @('false', 'true')) {
            foreach ($suite in @('--business-preview-only', '--workspace-grid-only', '--workspace-refresh-only', '--shared-operations-only', '--offline-import-only')) {
              dotnet run --project tests/WebViewChecks/WebViewChecks.csproj -c Release -p:PlaywrightPlatform=win "-p:PilotAdmin=$edition" -- $suite --screenshots "artifacts/ergonomics/$edition-$suite" 2>&1 | Tee-Object "artifacts/ergonomics/$edition-$suite.log"
              if ($LASTEXITCODE -ne 0) { throw "Existing interface checks failed ($edition $suite)." }
            }
          }
      - name: Conserver les preuves sans publier de pack
        if: always()
        uses: ./.github/actions/retain-evidence
        with:
          name: ergonomics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ergonomics/
            artifacts/field-integrated/
