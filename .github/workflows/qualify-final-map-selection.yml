name: Qualify final geographic selection before integration
on:
  push:
    branches: ['codex/glpi-ticket-500ms-kitt-20261116']
    paths: ['.github/workflows/qualify-final-map-selection.yml']
permissions:
  contents: write
concurrency:
  group: final-map-selection
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'M4D135/GLPI-Pilot' && github.ref == 'refs/heads/codex/glpi-ticket-500ms-kitt-20261116'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Replace the removed ticket table interaction with the geographic picker
        shell: python
        run: |
          import hashlib,pathlib,subprocess
          name='tests/WebViewChecks/Program.LocalFileTest.cs'
          raw=subprocess.check_output(['git','show','HEAD:'+name])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='c0727210c3d66e94b4edb2db6aaadbddd1926c24','Source changed'
          text=raw.decode('utf-8')
          old='        await page.GetByRole(AriaRole.Checkbox, new() { Name = "Sélectionner le ticket 42", Exact = true }).CheckAsync();'
          new='''        // The map now selects places; the only ticket grid belongs to Search.
                  if (await Button("Effacer les lieux").IsEnabledAsync()) await Button("Effacer les lieux").ClickAsync();
                  if (await mapPreview.Locator("[data-map-action=list]").GetAttributeAsync("aria-expanded") != "true")
                      await mapPreview.Locator("[data-map-action=list]").ClickAsync();
                  await mapPreview.Locator(".maps-place[data-located=true]").ClickAsync();
                  Require(await page.Locator(".maps-selection-panel").GetAttributeAsync("data-total") == "1"
                      && await page.Locator(".maps-ticket-panel,.maps-ticket-rows").CountAsync() == 0,
                      "Geographic selection retains the single localized ticket without restoring the removed map ticket table.");'''
          assert text.count(old)==1
          text=text.replace(old,new)
          old='Selecting the site synchronizes the map popup, reference address and scoped ticket list.'
          assert text.count(old)==1
          text=text.replace(old,'Selecting the site synchronizes the map popup, reference address and geographic selection.')
          pathlib.Path(name).write_bytes(text.encode('utf-8'))
          subprocess.run(['git','add','--',name],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only'],text=True).strip()==name
          pathlib.Path('artifacts/final-map-selection').mkdir(parents=True,exist_ok=True)
          pathlib.Path('artifacts/final-map-selection/changes.patch').write_bytes(subprocess.check_output(['git','diff','--cached']))
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Entire real imported-file journey in Standard and Admin editions
        run: |
          $browser = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Real browser missing.' }
          $env:GLPI_TEST_CHROMIUM = $browser
          foreach ($edition in @('false','true')) {
            dotnet run --project tests/WebViewChecks/WebViewChecks.csproj -c Release -p:PlaywrightPlatform=win "-p:PilotAdmin=$edition" -- --offline-import-only --screenshots "artifacts/final-map-selection/$edition" 2>&1 | Tee-Object "artifacts/final-map-selection/$edition.log"
            if ($LASTEXITCODE -ne 0) { throw "Imported-file journey failed: $edition" }
          }
      - name: Commit the corrected test only after both real journeys succeed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/glpi-ticket-500ms-kitt-20261116
          gh auth setup-git
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate geographic tour selection through the full imported-file interface journey'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > artifacts/final-map-selection/commit.txt
      - name: Retain logs and actual interface screenshots without publishing a pack
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-map-selection-${{ github.run_id }}
          path: artifacts/final-map-selection/
          retention-days: 7
