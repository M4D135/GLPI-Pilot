name: Integrate neutral interface copy
on:
  push:
    branches: ['codex/glpi-ticket-500ms-kitt-20261116']
    paths: ['.github/workflows/integrate-neutral-copy.yml', '.github/patches/neutral-copy-*.bin']
permissions:
  contents: write
concurrency:
  group: integrate-neutral-interface-copy
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'M4D135/GLPI-Pilot' && github.ref == 'refs/heads/codex/glpi-ticket-500ms-kitt-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply reviewed text edits to unchanged source files
        shell: python
        run: |
          import gzip,hashlib,json,pathlib,subprocess
          evidence=pathlib.Path('artifacts/neutral-copy');evidence.mkdir(parents=True,exist_ok=True)
          raw=b''.join(pathlib.Path('.github/patches/neutral-copy-'+str(i)+'.bin').read_bytes() for i in range(1,9))
          assert hashlib.sha256(raw).hexdigest()=='cd270340006cab83fd7893a8e1d53ec33fc5e90d4b2a87aadced6433b82afa11','Payload integrity mismatch'
          payload=json.loads(gzip.decompress(raw))
          base=payload['base']
          assert base=='aacaebfaa8aa78a7ec65f862a2ac54a2aac3361b'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          def names(ref):return set(subprocess.check_output(['git','ls-tree','-r','--name-only',ref],text=True).splitlines())
          old_names,current_names=names(base),names('HEAD')
          manifest={}
          assert len(payload['files'])==106
          for name,edits in payload['files'].items():
            path=pathlib.Path(name)
            assert not path.is_absolute() and '..' not in path.parts
            assert name.startswith(('web/','src/GlpiPilot/','tests/'))
            assert not any(part.is_symlink() for part in (path,*path.parents))
            old=subprocess.check_output(['git','show',base+':'+name]) if name in old_names else b''
            current=subprocess.check_output(['git','show','HEAD:'+name]) if name in current_names else b''
            assert current==old and (name in old_names)==(name in current_names),'Source changed: '+name
            text=old.decode('utf-8');last=0
            for start,end,replacement in edits:
              assert isinstance(start,int) and isinstance(end,int) and isinstance(replacement,str)
              assert last<=start<=end<=len(text)
              last=end
            for start,end,replacement in reversed(edits):text=text[:start]+replacement+text[end:]
            result=text.encode('utf-8')
            path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(result)
            subprocess.run(['git','add','--',name],check=True)
            manifest[name]=hashlib.sha1(b'blob '+str(len(result)).encode()+b'\0'+result).hexdigest()
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==set(payload['files']),'Unexpected staged paths'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          (evidence/'files.json').write_text(json.dumps(manifest,indent=2))
          (evidence/'changes.log').write_bytes(subprocess.check_output(['git','diff','--cached','--stat']))
      - name: Check syntax and neutral interface regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          while IFS= read -r file; do
            case "$file" in *.js|*.mjs|*.cjs) node --check "$file" ;; esac
          done < <(git diff --cached --name-only)
          node --test tests/InterfaceCopyChecks/run.mjs tests/ErgonomicsChecks/ticket-live-read.test.mjs tests/WorkspaceGridChecks/run.mjs tests/PilotBoardLabelsChecks/run.mjs tests/WeatherGroupPickerChecks/run.mjs 2>&1 | tee artifacts/neutral-copy/unit.log
      - name: Commit only tested source and tests to the current feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/glpi-ticket-500ms-kitt-20261116
          gh auth setup-git
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove promotional copy and use neutral interface labels'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee artifacts/neutral-copy/commit.txt
      - name: Retain checks without publishing an application pack
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: neutral-copy-${{ github.run_id }}
          path: artifacts/neutral-copy/
          retention-days: 7
          if-no-files-found: warn
