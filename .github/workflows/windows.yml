name: Windows et PostgreSQL — tests et packs PROD / DEV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - 'tests/**'
      - 'docs/**'
      - 'support/**'
      - 'licenses/**'
      - 'README.md'
      - 'build.ps1'
      - 'build-tools/**'
      - '.github/workflows/windows.yml'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'

# Tests run with read-only repository access. Only the final release job may publish validated packs.
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 · contrôles réels et publication
    runs-on: windows-2025
    timeout-minutes: 75
    outputs:
      prod-artifact-id: ${{ steps.upload_prod.outputs.artifact-id }}
      dev-artifact-id: ${{ steps.upload_dev.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

    steps:
      - name: Récupérer les sources
        # Official release v7.0.1; immutable commit verified through the GitHub API.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer le SDK .NET 10 stable
        id: dotnet
        # Official release v6.0.0.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
          architecture: x64

      - name: Sélectionner le SDK et préparer les journaux
        env:
          CI_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          if (-not (Test-Path -LiteralPath global.json)) {
            @{ sdk = @{ version = $env:CI_DOTNET_SDK; rollForward = 'latestPatch'; allowPrerelease = $false } } |
              ConvertTo-Json -Depth 3 | Set-Content -LiteralPath global.json -Encoding utf8
          }
          New-Item -ItemType Directory -Path artifacts/windows-ci/logs -Force | Out-Null
          dotnet --info | Tee-Object -FilePath artifacts/windows-ci/logs/dotnet-info.log
          if ($LASTEXITCODE -ne 0) { throw '.NET information unavailable.' }
          "Commit: $env:GITHUB_SHA`nRunner: $env:RUNNER_OS / $env:RUNNER_ARCH`nImage: $env:ImageOS / $env:ImageVersion" |
            Set-Content -LiteralPath artifacts/windows-ci/logs/build-context.log -Encoding utf8

      - name: Diagnostics, configurations et moteurs de pilotage
        timeout-minutes: 12
        run: ./build-tools/Invoke-WindowsCi.ps1 -Stage BclChecks

      - name: Vérifier le navigateur et les exports sur des pages synthétiques
        timeout-minutes: 8
        run: ./build-tools/Invoke-WindowsCi.ps1 -Stage BrowserChecks

      - name: Vérifier les moteurs C# et toutes les interfaces WebView
        timeout-minutes: 10
        run: ./build-tools/Invoke-WindowsCi.ps1 -Stage WebViewChecks

      - name: Construire les packs PROD et DEV (exe + wad)
        id: pack
        timeout-minutes: 40
        run: ./build-tools/Invoke-WindowsCi.ps1 -Stage BuildPack

      - name: Vérifier le démarrage, le zoom et sa mémorisation dans le pack PROD
        timeout-minutes: 8
        run: ./build-tools/Invoke-WindowsCi.ps1 -Stage PackStartup

      - name: Vérifier le remplacement réel du pack et le retour arrière
        timeout-minutes: 20
        run: ./build-tools/Invoke-WindowsCi.ps1 -Stage UpdateStartup

      - name: Joindre le pack PROD Windows validé
        id: upload_prod
        # Official release v7.0.2. Upload the ready ZIP directly, without a second ZIP wrapper.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ steps.pack.outputs.prod-pack-path }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Joindre le pack DEV Windows complet
        id: upload_dev
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ steps.pack.outputs.dev-pack-path }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Résumé du résultat Windows
        env:
          PROD_URL: ${{ steps.upload_prod.outputs.artifact-url }}
          DEV_URL: ${{ steps.upload_dev.outputs.artifact-url }}
        run: |
          @"
          ## Validation Windows terminée
          - Contrôles des diagnostics, configurations, dashboards, dispositions, recherche, techniciens, villes, tournées et requêtes : exécutés avec succès.
          - Bibliothèque SQLite et contributions d’équipe : persistance, versions, conflits et reprise contrôlés localement.
          - Acquisition tous statuts, onglets de consultation, pagination et restauration de la recherche : contrôlées sur des pages synthétiques.
          - Interfaces locales HTML/CSS/ES modules : parcours et interactions contrôlés avec les vrais handlers C# et la CSP de production.
          - Page Bibliothèque : parcours dédié et captures joints aux journaux.
          - Pack PROD extrait : vrai hôte WinForms/WebView2 visible, runtime fixe embarqué, handshake après premier rendu, profil synthétique isolé, fermeture normale.
          - Zoom natif réel à 125 %, remise à 100 %, fenêtre compacte et restauration de 110 % dans un nouveau processus.
          - Mise à jour réelle sur copies du pack : processus en cours et EXE verrouillé refusés, démarrage confirmé puis restauration après échec forcé.
          - Captures des vues Windows en thèmes clair/sombre et à plusieurs tailles jointes aux journaux.
          - [Télécharger PROD]($env:PROD_URL) · [Télécharger DEV]($env:DEV_URL).
          - Chaque ZIP contient uniquement GLPI-Pilot.exe et wad à sa racine ; .NET et WebView2 sont embarqués, DEV inclut les sources dépliées.
          - Les deux packs utilisent le même exécutable vérifié ; empreintes de chaque fichier contrôlées.
          - Artefacts conservés 30 jours, connexion GitHub requise.
          - Navigation, portée et exports : contrôlés dans un navigateur isolé sur des pages synthétiques.
          - Les journaux et le SHA-256 sont joints séparément. Le portail GLPI et le SSO de l’entreprise n’ont pas été testés.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Conserver les journaux, même en cas d’échec
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-ci/logs/
          if-no-files-found: warn
          retention-days: 14

  postgres:
    name: PostgreSQL 17 · synchronisation réelle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        # Official docker.io/library/postgres:17 OCI index; registry digest verified 2026-10-22.
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_DB: glpi_pilot_checks
          POSTGRES_USER: glpi_pilot_checks
          # Disposable CI service only; never a deployment credential.
          POSTGRES_PASSWORD: glpi_pilot_ephemeral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glpi_pilot_checks -d glpi_pilot_checks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      GLPI_PILOT_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Database=glpi_pilot_checks;Username=glpi_pilot_checks;Password=glpi_pilot_ephemeral_ci;SSL Mode=Disable;GSS Encryption Mode=Disable;Include Error Detail=false'
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Installer le SDK .NET 10 stable
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
          architecture: x64
      - name: Consigner le contexte et le moteur PostgreSQL réel
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/postgres-ci/logs
          dotnet --info | tee artifacts/postgres-ci/logs/dotnet-info.log
          printf 'Commit: %s\nRunner: %s / %s\nImage: %s / %s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" > artifacts/postgres-ci/logs/build-context.log
          docker exec "$POSTGRES_CONTAINER" psql -U glpi_pilot_checks -d glpi_pilot_checks -Atc 'SHOW server_version;' | tee artifacts/postgres-ci/logs/postgres-version.log
          grep -Eq '^17\.' artifacts/postgres-ci/logs/postgres-version.log
      - name: Vérifier les échanges versionnés de la bibliothèque et de l’équipe
        run: |
          set -euo pipefail
          timeout 300s dotnet run --project tests/TicketLibraryChecks/TicketLibraryChecks.csproj -c Release -- --postgres 2>&1 | tee artifacts/postgres-ci/logs/ticket-library-postgres-checks.log
          timeout 300s dotnet run --project tests/SharedWorkspaceChecks/SharedWorkspaceChecks.csproj -c Release -- --postgres 2>&1 | tee artifacts/postgres-ci/logs/shared-workspace-postgres-checks.log
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('artifacts/postgres-ci/logs')
          suites = [('ticket-library-postgres-checks.log', 'ticket library', 37, 9), ('shared-workspace-postgres-checks.log', 'shared workspace', 20, 8)]
          for name, label, expected_total, expected_postgres in suites:
              report = (root / name).read_text(encoding='utf-8')
              summaries = re.findall(r'^(\d+)/(\d+) ' + re.escape(label) + r' checks passed\.$', report, re.M)
              if summaries != [(str(expected_total), str(expected_total))]:
                  raise SystemExit(f'{name}: expected one {expected_total}/{expected_total} successful summary')
              real = len(re.findall(r'^PASS PostgreSQL:', report, re.M))
              if real != expected_postgres:
                  raise SystemExit(f'{name}: expected {expected_postgres} real PostgreSQL scenarios, found {real}')
              print(f'{name}: {summaries[0][0]}/{summaries[0][1]} checks, including {real} real PostgreSQL scenarios')
          PY
      - name: Résumé du résultat PostgreSQL
        run: |
          {
            echo '## Validation PostgreSQL 17 terminée'
            echo '- Serveur officiel éphémère, deux bases SQLite locales ou plus et échanges PostgreSQL réels.'
            echo '- Versions, conflits, accusés de réception, reprise des curseurs et annulation contrôlés.'
            echo '- Les schémas de test sont isolés ; aucun serveur ou identifiant de production utilisé.'
            echo '- Les journaux PostgreSQL sont joints séparément aux preuves Windows.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conserver les preuves PostgreSQL, même en cas d’échec
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: postgres-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/postgres-ci/logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publier les deux packs Windows validés
    needs: [windows, postgres]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Récupérer les notes correspondant au commit testé
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publier les packs exacts après leurs contrôles de démarrage
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_ARTIFACT_ID: ${{ needs.windows.outputs.prod-artifact-id }}
          DEV_ARTIFACT_ID: ${{ needs.windows.outputs.dev-artifact-id }}
        run: bash build-tools/publish-release.sh
