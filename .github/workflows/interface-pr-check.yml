name: Interface - contrôle court des PR
# Fast feedback for pull requests that touch the interface: the real C# bridge and WebView suites for
# navigation, palette, motion and library, in both editions. It never builds packs nor publishes.
# The complete Windows/PostgreSQL qualification still runs on main and remains required before any release.
on:
  workflow_dispatch:
  # Push only (no pull_request trigger): fork code is never run by this repository's workflows. Reviewed
  # external changes can be copied onto a repository branch; the check follows that branch SHA.
  push:
    branches-ignore: [main]
    paths: ['web/**', 'src/**', 'tests/WebViewChecks/**', '.github/workflows/interface-pr-check.yml', '.github/actions/retain-evidence/**', 'build-tools/retain-ci.py']
permissions:
  contents: read
concurrency:
  group: interface-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interface:
    name: Interface · Admin=${{ matrix.admin }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        admin: ['false', 'true']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Navigation, palette, mouvement et bibliothèque
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts/interface-pr -Force | Out-Null
          $browser = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe', 'C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No Chromium browser on the runner.' }
          $env:GLPI_TEST_CHROMIUM = $browser
          foreach ($suite in @('--navigation-only', '--palette-only', '--motion-only', '--library-only')) {
            dotnet run --project tests/WebViewChecks/WebViewChecks.csproj -c Release -p:PlaywrightPlatform=win -p:PilotAdmin=${{ matrix.admin }} -- $suite --screenshots "artifacts/interface-pr/$suite" 2>&1 | Tee-Object "artifacts/interface-pr/$suite.log"
            if ($LASTEXITCODE -ne 0) { throw "Interface regression: $suite" }
          }
      - name: Conserver les preuves
        if: always()
        uses: ./.github/actions/retain-evidence
        with:
          name: interface-pr-${{ matrix.admin }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/interface-pr/
