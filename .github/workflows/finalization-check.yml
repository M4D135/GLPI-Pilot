name: Finalisation 3.13 - regressions et vrais hotes sans publication
on:
  workflow_dispatch:
  push:
    branches: [codex/finalisation-3130-20261028]
permissions:
  contents: read
jobs:
  compatibility:
    uses: ./.github/workflows/library-compatibility-check.yml
  native:
    uses: ./.github/workflows/native-export-diagnostics.yml
  offline-repetition:
    name: Trois imports et transitions complets · Admin=${{ matrix.admin }}
    runs-on: windows-2025
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        admin: ['false', 'true']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Trois exécutions consécutives, arrêt au premier échec
        run: |
          New-Item -ItemType Directory -Path artifacts/offline-repetition -Force | Out-Null
          $browser = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe', 'C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No Chromium browser on runner.' }
          $env:GLPI_TEST_CHROMIUM = $browser
          foreach ($iteration in 1..3) {
            dotnet run --project tests/WebViewChecks/WebViewChecks.csproj -c Release -p:PlaywrightPlatform=win -p:PilotAdmin=${{ matrix.admin }} -- --offline-import-only --screenshots "artifacts/offline-repetition/$iteration" 2>&1 | Tee-Object "artifacts/offline-repetition/$iteration.log"
            if ($LASTEXITCODE -ne 0) { throw "Offline transition check failed at iteration $iteration." }
          }
      - name: Conserver chaque exécution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-repetition-${{ matrix.admin }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/offline-repetition/
          retention-days: 14
          if-no-files-found: warn
