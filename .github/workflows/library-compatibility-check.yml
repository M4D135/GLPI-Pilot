name: Bibliotheque et transitions - compatibilite sans publication
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/collection-compatibility-20261028]
    paths: ['src/**', 'tests/**', 'web/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  collection:
    uses: ./.github/workflows/library-collection-check.yml
  legacy-library:
    name: Parcours historique - Admin=${{ matrix.admin }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        admin: ['false', 'true']
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Verifier les annulations et reprises avec les assertions existantes
        run: |
          New-Item -ItemType Directory -Path artifacts/library-compatibility -Force | Out-Null
          "Commit: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID / $env:GITHUB_RUN_ATTEMPT`nAdmin: ${{ matrix.admin }}" | Set-Content artifacts/library-compatibility/context.log
          $browser = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe', 'C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No Chromium test browser on this runner.' }
          $env:GLPI_TEST_CHROMIUM = $browser
          dotnet run --project tests/WebViewChecks/WebViewChecks.csproj -c Release -p:PlaywrightPlatform=win -p:PilotAdmin=${{ matrix.admin }} -- --library-workflows-only --screenshots artifacts/library-compatibility/screenshots 2>&1 | Tee-Object artifacts/library-compatibility/legacy.log
          if ($LASTEXITCODE -ne 0) { throw 'Existing library workflow assertions failed.' }
      - name: Conserver les preuves fictives sans publication
        if: always()
        uses: ./.github/actions/retain-evidence
        with:
          name: library-compatibility-${{ matrix.admin }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/library-compatibility/
  refresh-transitions:
    name: Transitions de contexte - Admin=${{ matrix.admin }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        admin: ['false', 'true']
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Trois parcours consecutifs sans relance apres echec
        run: |
          New-Item -ItemType Directory -Path artifacts/refresh-transitions -Force | Out-Null
          "Commit: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID / $env:GITHUB_RUN_ATTEMPT`nAdmin: ${{ matrix.admin }}" | Set-Content artifacts/refresh-transitions/context.log
          $browser = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe', 'C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No Chromium test browser on this runner.' }
          $env:GLPI_TEST_CHROMIUM = $browser
          foreach ($sequence in 1..3) {
            dotnet run --project tests/WebViewChecks/WebViewChecks.csproj -c Release -p:PlaywrightPlatform=win -p:PilotAdmin=${{ matrix.admin }} -- --workspace-refresh-only --screenshots "artifacts/refresh-transitions/screenshots-$sequence" 2>&1 | Tee-Object "artifacts/refresh-transitions/sequence-$sequence.log"
            if ($LASTEXITCODE -ne 0) { throw "Context transition assertion failed at sequence $sequence. No retry is allowed in this job." }
          }
      - name: Conserver les traces de transition fictives
        if: always()
        uses: ./.github/actions/retain-evidence
        with:
          name: refresh-transitions-${{ matrix.admin }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/refresh-transitions/
  runtime-session:
    name: Isolation et annulation du moteur complet
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Verifier toute la suite runtime avec le vrai lecteur sur portail fictif
        run: |
          New-Item -ItemType Directory -Path artifacts/runtime-compatibility -Force | Out-Null
          "Commit: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID / $env:GITHUB_RUN_ATTEMPT" | Set-Content artifacts/runtime-compatibility/context.log
          $browser = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe', 'C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No Chromium test browser on this runner.' }
          $env:GLPI_TEST_CHROMIUM = $browser
          dotnet run --project tests/RuntimeSessionChecks/RuntimeSessionChecks.csproj -c Release -p:PlaywrightPlatform=win 2>&1 | Tee-Object artifacts/runtime-compatibility/runtime.log
          if ($LASTEXITCODE -ne 0) { throw 'Existing runtime-session assertions failed.' }
      - name: Conserver les preuves runtime fictives
        if: always()
        uses: ./.github/actions/retain-evidence
        with:
          name: runtime-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-compatibility/
