name: Verify exact library workflows before final qualification
on:
  push:
    branches: ['ops/glpi-shared-sync-timing-20261117']
    paths: ['.github/workflows/verify-library-workflows.yml']
permissions:
  contents: read
jobs:
  library-workflows:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '2ce599f2e15216fca1ebefcb2b02aa665d5680e1'
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Verify the exact unchanged library suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/library-workflows -Force | Out-Null
          $env:GLPI_TEST_CHROMIUM = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $env:GLPI_TEST_CHROMIUM) { throw 'Browser required.' }
          dotnet run --project tests/WebViewChecks/WebViewChecks.csproj -c Release -p:PlaywrightPlatform=win -- --library-workflows-only --screenshots artifacts/library-workflows/screenshots 2>&1 | Tee-Object artifacts/library-workflows/checks.log
          if ($LASTEXITCODE -ne 0) { throw 'Library workflow regression.' }
          $text = Get-Content artifacts/library-workflows/checks.log -Raw
          if ($text -notmatch '(?m)^([1-9]\d*)/\1 library workflows WebView checks passed\.\r?$') { throw 'Expected library suite did not run.' }
      - name: Retain exact result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-library-workflows-${{ github.run_id }}
          path: artifacts/library-workflows/
          retention-days: 14
