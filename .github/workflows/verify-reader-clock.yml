name: Verify deterministic pre-refresh reader navigation
on:
  push:
    branches: ['codex/glpi-ticket-500ms-kitt-20261116']
    paths: ['.github/workflows/verify-reader-clock.yml']
permissions:
  contents: write
concurrency:
  group: verify-reader-clock
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'M4D135/GLPI-Pilot'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Correct the test clock without changing application code or source provenance
        shell: python
        run: |
          import hashlib,pathlib,subprocess
          p=pathlib.Path('tests/WorkplaceBridgeChecks/BrowserChecks.cs')
          raw=subprocess.check_output(['git','show','HEAD:'+str(p).replace('\\','/')])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='82d7920d5b839053b991086b37f9bbb8c6a7899c','Unexpected source file'
          s=raw.decode('utf-8')
          def once(old,new):
            global s
            assert s.count(old)==1,(old,s.count(old))
            s=s.replace(old,new)
          once('bool cacheDetail = true, bool cachedSource = false)', 'bool cacheDetail = true, bool holdLiveReadTimer = false)')
          once('''            // Cached-source navigation must remain network-free regardless of runner speed.
                      if (cachedSource) await Page.EvaluateAsync("()=>workState.session.cachedSource=true");''', '''            // These two navigation tests inspect the interval before the 500 ms read.
                      // Hold only that timer, never change source provenance or production code.
                      // The live-read suite separately advances the delay, cache and cancellation.
                      if (holdLiveReadTimer) await Page.EvaluateAsync("""
                          () => {
                            const schedule=window.setTimeout.bind(window),cancel=window.clearTimeout.bind(window);
                            let sequence=0;window.workLiveReadTimers=new Map();
                            window.setTimeout=(callback,delay,...args)=>{
                              if(delay!==500)return schedule(callback,delay,...args);
                              const id=--sequence;workLiveReadTimers.set(id,()=>callback(...args));return id;
                            };
                            window.clearTimeout=id=>{if(!workLiveReadTimers.delete(id))cancel(id);};
                          }
                          """);''')
          assert s.count('cacheDetail: false, cachedSource: true')==2
          s=s.replace('cacheDetail: false, cachedSource: true','cacheDetail: false, holdLiveReadTimer: true')
          once('WebView cached Tickets retains its queried list and unfinished personal work','WebView Tickets retains its queried list and unfinished work before delayed refresh')
          once('WebView cached saved dossiers and original-row links remain local without automatic reads','WebView saved dossier navigation remains local before delayed refresh')
          once('            "Opening a sorted and paged row keeps its original index and opens a full-page ticket while retaining the hidden search.");', '            "Opening a sorted and paged row keeps its original index and opens a full-page ticket while retaining the hidden search.");\n        await ui.Page.WaitForFunctionAsync("()=>workLiveReadTimers.size===1");\n        Check(ui.Operations.All(op => op != "workplace.ticket.read"), "Opening schedules the 500 ms read without executing it immediately.");')
          once('        Check(ui.Operations.All(op => op is not ("workplace.ticket.read" or "workplace.ticket.browser" or "workplace.ticket.tab")) && ui.ExternalRequests.Count == 0,\n            "Cached-source opening, moving and returning never start a GLPI read, including with the legacy automatic-read setting enabled. Live-source delay and cancellation have separate regression coverage.");', '        Check(await ui.Page.EvaluateAsync<int>("()=>workLiveReadTimers.size") == 0\n            && ui.Operations.All(op => op is not ("workplace.ticket.read" or "workplace.ticket.browser" or "workplace.ticket.tab")) && ui.ExternalRequests.Count == 0,\n            "Returning before the controlled delay cancels all scheduled reads, including with the legacy setting enabled; source, notes and list stay unchanged.");')
          new=s.encode('utf-8')
          assert hashlib.sha1(b'blob '+str(len(new)).encode()+b'\0'+new).hexdigest()=='4560c182e2611857c9d9146d5ad26c3362801f4e','Reviewed result mismatch'
          p.write_bytes(new)
          subprocess.run(['git','add','--',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only'],text=True).strip()=='tests/WorkplaceBridgeChecks/BrowserChecks.cs'
          evidence=pathlib.Path('artifacts/reader-clock');evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'tested-blob.txt').write_text('4560c182e2611857c9d9146d5ad26c3362801f4e\n')
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          architecture: x64
      - name: Verify every real C# handler and WebView reader check
        run: |
          $browser = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Chromium browser required.' }
          $env:GLPI_TEST_CHROMIUM = $browser
          $env:GLPI_TEST_WORKPLACE_SCREENSHOTS = Join-Path $PWD 'artifacts/reader-clock/screenshots'
          dotnet run --project tests/WorkplaceBridgeChecks/WorkplaceBridgeChecks.csproj -c Release -p:PlaywrightPlatform=win 2>&1 | Tee-Object artifacts/reader-clock/workplace.log
          if ($LASTEXITCODE -ne 0) { throw 'Reader checks failed.' }
          $node = Join-Path $PWD 'tests/WorkplaceBridgeChecks/bin/Release/net10.0/.playwright/node/win32_x64/node.exe'
          & $node --test tests/ErgonomicsChecks/ticket-live-read.test.mjs 2>&1 | Tee-Object artifacts/reader-clock/live-read.log
          if ($LASTEXITCODE -ne 0) { throw 'Live-read debounce regression.' }
      - name: Push only the Windows-verified test source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/glpi-ticket-500ms-kitt-20261116
          gh auth setup-git
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make pre-refresh navigation checks deterministic without changing production behavior'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > artifacts/reader-clock/commit.txt
      - name: Retain test evidence and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reader-clock-${{ github.run_id }}
          path: artifacts/reader-clock/
          retention-days: 14
