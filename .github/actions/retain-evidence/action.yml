name: Conserver les preuves du job
description: Atteste les empreintes des originaux dans le journal du job, puis joint les preuves au run.
inputs:
  path:
    required: true
    description: Dossier(s) de preuves, ou ZIP original unique.
  name:
    required: false
    description: Nom des preuves (vide pour un ZIP de distribution, joint à part sans enveloppe ZIP).
runs:
  using: composite
  steps:
    - if: runner.os == 'Windows'
      shell: pwsh
      env:
        GLPI_RETAIN_PATH: ${{ inputs.path }}
        GLPI_RETAIN_NAME: ${{ inputs.name }}
      run: python build-tools/retain-ci.py
    - if: runner.os == 'Linux'
      shell: bash
      env:
        GLPI_RETAIN_PATH: ${{ inputs.path }}
        GLPI_RETAIN_NAME: ${{ inputs.name }}
      run: python3 build-tools/retain-ci.py
    # Les runners hébergés de GitHub sont effacés après chaque job : le magasin local de retain-ci.py disparaît avec
    # eux. Les journaux et captures sont donc joints au run ; le ZIP PROD-LIGHT l'est par son workflow, sans enveloppe.
    - if: inputs.name != ''
      # Official release v7.0.2.
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: warn
        retention-days: 14
