<script>
  window.businessSubmits = 0;
  document.querySelector('#massformTicket').addEventListener('submit', event => { event.preventDefault(); window.businessSubmits++; });
  window.renderLegacyRows = (size, total) => {
    const tbody = document.querySelector('#legacy-rows');
    tbody.replaceChildren();
    for (let i = 1; i <= size; i++) {
      const row = document.createElement('tr');
      for (let col = 1; col <= 16; col++) {
        const cell = document.createElement('td');
        cell.textContent = col === 1 ? (6000000 + i).toLocaleString('fr-FR') : 'Fixture ' + i + ' / ' + col;
        row.append(cell);
      }
      tbody.append(row);
    }
    for (const id of ['legacy-range-top', 'legacy-range-bottom']) document.getElementById(id).textContent = 'De ' + (total ? 1 : 0) + ' à ' + size + ' sur ' + total;
    for (const id of ['legacy-limit-top', 'legacy-limit-bottom']) document.getElementById(id).value = size >= total ? '9999999' : '20';
  };
  renderLegacyRows(20, 828);
</script></html>
