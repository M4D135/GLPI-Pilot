<script>

document.addEventListener('click',e=>{if(e.target.closest('[data-business]'))window.businessClicks++});
for(const id of ['treatment-tab','history-tab'])document.getElementById(id).addEventListener('click',async e=>{e.preventDefault();window.tabClicks++;const link=e.currentTarget;for(const p of document.querySelectorAll('[role=tabpanel]'))p.hidden=true;for(const a of document.querySelectorAll('[aria-selected]'))a.setAttribute('aria-selected','false');for(const li of document.querySelectorAll('.ui-tabs-active'))li.classList.remove('ui-tabs-active');const panel=document.getElementById(link.getAttribute('aria-controls'));panel.hidden=false;panel.setAttribute('aria-busy','true');panel.innerHTML=await(await fetch(link.href,{method:'POST'})).text();panel.removeAttribute('aria-busy');link.setAttribute('aria-selected','true')});
